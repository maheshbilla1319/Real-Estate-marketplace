
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EstateAura</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Animated Background -->
  <div class="background">
    <div class="bg-overlay"></div>
    <span class="floating-shape shape-one"></span>
    <span class="floating-shape shape-two"></span>
    <span class="floating-shape shape-three"></span>
  </div>

  <!-- Header -->
  <header class="top-header">
   <a href="index.html" class="logo">
  <img
    src="assets/image.webp"
    alt="EstateAura Logo"
    class="logo-image"
  >
</a>

    <a href="index.html" class="home-link">
      <i class="bi bi-arrow-left"></i> Back to Home
    </a>
  </header>

  <!-- Login Section -->
  <main class="login-section">
    <div class="login-card" data-aos="zoom-in" data-aos-duration="900">

      <div class="card-heading">
        <div class="heading-icon">
          <i class="bi bi-house-heart-fill"></i>
        </div>
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Login to <span>EstateAura</span></h1>
        <p class="subtitle">Find your place. Begin your next chapter.</p>
      </div>

      <form id="loginForm" novalidate>

        <!-- Role Selection -->
        <div class="form-group">
          <label class="field-label">Select Your Role</label>

          <div class="role-options">
            <label class="role-option">
              <input type="radio" name="role" value="buyer" checked>
              <span class="role-content">
                <i class="bi bi-person-fill"></i>
                <span>
                  <strong>Buyer / Tenant</strong>
                  <small>Find your dream property</small>
                </span>
              </span>
            </label>

            <label class="role-option">
              <input type="radio" name="role" value="agent">
              <span class="role-content">
                <i class="bi bi-building"></i>
                <span>
                  <strong>Agent / Owner</strong>
                  <small>Manage your properties</small>
                </span>
              </span>
            </label>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="field-label">Email Address</label>
          <div class="input-wrap">
            <i class="bi bi-envelope"></i>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your Gmail or email"
              autocomplete="email"
              required
            >
          </div>
          <small class="field-error" id="emailError"></small>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="field-label">Password</label>
          <div class="input-wrap">
            <i class="bi bi-lock"></i>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <small class="field-error" id="passwordError"></small>
        </div>

        <div class="form-extra">
          <label class="remember-option">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="404.html" class="forgot-link">Forgot password?</a>
        </div>

        <p class="form-message" id="formMessage" role="alert"></p>

        <button type="submit" class="login-button" id="loginButton">
          <span>Login to Dashboard</span>
          <i class="bi bi-arrow-right"></i>
        </button>

        <div class="divider"><span>OR</span></div>

        <p class="signup-text">
          Don't have an account?
          <a href="signup.html">Create Account</a>
        </p>

      </form>

      <p class="security-note">
        <i class="bi bi-shield-lock-fill"></i>
        Your property journey starts here.
      </p>

    </div>

    <div class="side-caption" data-aos="fade-up" data-aos-delay="300">
      <span class="caption-line"></span>
      <p>Discover spaces that feel like home.</p>
    </div>
  </main>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
